[project]
name = "transformer-from-scratch"
version = "1.0.0"
description = "A GPT-style Transformer language model, BPE tokenizer, and training loop built from scratch in PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "einops>=0.8.1",
    "matplotlib>=3.8",
    "numpy<2",
    "regex>=2024.11.6",
    "torch~=2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch~=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Intel Macs
]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transformer"
module-root = ""

[tool.uv]
package = true

[tool.ruff]
line-length = 120
